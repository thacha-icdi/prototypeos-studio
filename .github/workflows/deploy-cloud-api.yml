name: Deploy PrototypeOS Cloud API (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: prototypeos-cloud-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prototypeos-cloud-production
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
        run: |
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DATABASE_URL OIDC_ISSUER OIDC_AUDIENCE; do
            if [ -z "${!key}" ]; then echo "::error::Missing required configuration: $key"; exit 1; fi
          done
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Upload database credential securely
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OIDC_ISSUER: ${{ vars.OIDC_ISSUER }}
          OIDC_AUDIENCE: ${{ vars.OIDC_AUDIENCE }}
        run: npx wrangler deploy --var OIDC_ISSUER:"$OIDC_ISSUER" --var OIDC_AUDIENCE:"$OIDC_AUDIENCE"
